name: Commit Dragon

on:
  schedule:
    - cron: "0 */6 * * *"   # feed the dragon every 6 hours
  workflow_dispatch:         # run it manually from the Actions tab

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Draw the dragon
        run: node scripts/generate.js
        env:
          GITHUB_USER: ${{ github.repository_owner }}
      - name: Commit the new picture
        run: |
          git config user.name "commit-dragon[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/dragon.svg
          git diff --staged --quiet || (git commit -m "Dragon update" && git push)
